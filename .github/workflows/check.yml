name: check

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, to catch a plugin repo renamed or a stable branch removed.
    - cron: "0 12 * * 1"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run scripts/check.sh
        run: scripts/check.sh
